# esbuild's postinstall validates/installs its platform binary; core-js's only
# prints a funding banner, so it stays denied.
allowBuilds:
  core-js: false
  esbuild: true
patchedDependencies:
  '@xwiki/platform-editors-blocknote-react@18.5.0': patches/@xwiki__platform-editors-blocknote-react@18.5.0.patch
